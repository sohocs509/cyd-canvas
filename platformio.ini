; SPDX-License-Identifier: Apache-2.0
[platformio]
default_envs = cyd-2432s028r

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.partitions = boards/partitions-4mb.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2
    bblanchon/ArduinoJson@^7.1.0
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^2.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=1

; Sunmon "Cheap Yellow Display" ESP32-2432S028R (ILI9341, XPT2046, microSD on VSPI)
[env:cyd-2432s028r]
extends = env
build_flags =
    ${env.build_flags}
    -DBOARD_CYD_2432S028R=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; Same board without Bluetooth Wi-Fi setup: ~230 KB less flash and ~25 KB more free RAM.
[env:cyd-2432s028r-noble]
extends = env:cyd-2432s028r
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^9.2
    bblanchon/ArduinoJson@^7.1.0
    knolleary/PubSubClient@^2.8
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    ${env:cyd-2432s028r.build_flags}
    -DCYD_NO_BLE=1
